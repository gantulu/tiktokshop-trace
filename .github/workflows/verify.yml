name: Build and Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/supabase-edge-functions-storage

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check frontend
        run: npm run lint
      - name: Type check Edge Functions
        run: deno check supabase/functions/get-tiktok/index.ts supabase/functions/crud-tiktok-2/index.ts
      - name: Production build
        run: npm run build
